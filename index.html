<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的 GitHub Pages 网站</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(120deg, #4f46e5, #06b6d4);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 32px 40px;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
    }
    p {
      line-height: 1.7;
    }
    button {
      margin-top: 20px;
      padding: 12px 20px;
      border-radius: 999px;
      border: none;
      background: #22c55e;
      color: #064e3b;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #16a34a;
    }
    footer {
      margin-top: 24px;
      font-size: 0.85rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 欢迎来到我的网站</h1>
    <p>
      这是一个可以直接部署到 <strong>GitHub Pages</strong> 的静态网页示例。
      你可以自由修改 HTML、CSS 或 JavaScript，打造属于你自己的网站。
    </p>
    <button onclick="sayHello()">点我试试</button>
    <footer>
      <p>© 2025 我的 GitHub Pages</p>
    </footer>
  </div>

  <script>
    function sayHello() {
      alert("Hello! 这是一个静态网页示例 🚀");
    }
  </script>
</body>
</html>
